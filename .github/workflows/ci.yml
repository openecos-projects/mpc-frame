name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      design:
        description: Design ID or package path
        required: true
        default: "0"
        type: string
      test:
        description: Frame test name
        required: true
        default: boot
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VERILATOR_VERSION: "5.050"

jobs:
  source-check:
    if: github.event_name != 'workflow_dispatch'
    name: source-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Validate source and generated files
        run: |
          set -euo pipefail
          python -m py_compile scripts/design_registry.py scripts/run_regression.py \
            scripts/test_user_template.py scripts/check_docs.py \
            scripts/prepare_docs_site.py scripts/export_user_kit.py
          make -f Makefile.dev docs-check manifest-test registry-check
          make -f Makefile.dev registry-generate
          git diff --check
          git diff --exit-code
          test -z "$(git ls-files build dev/reference/sim/build)"
          test -z "$(git ls-files 'docs/**/*-qa.md' 'docs/**/qa/**')"

  frame-regression:
    if: github.event_name != 'workflow_dispatch'
    name: frame-regression
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Verilator
        run: bash scripts/ci/install_verilator.sh
      - name: Run FrameTop fast regression
        run: |
          make -f Makefile.dev stage9-test
          make -f Makefile.dev regression-fast
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frame-regression-logs
          path: build/logs/
          if-no-files-found: ignore
          retention-days: 7

  reference-regression:
    if: github.event_name != 'workflow_dispatch'
    name: reference-regression
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-riscv64-unknown-elf gcc-riscv64-unknown-elf
          bash scripts/ci/install_verilator.sh
      - name: Run reference acceptance regression
        run: make -f Makefile.dev reference-test
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reference-regression-logs
          path: |
            build/logs/
            build/reference-logs/
          if-no-files-found: ignore
          retention-days: 7

  trace:
    if: github.event_name == 'workflow_dispatch'
    name: trace
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DESIGN_INPUT: ${{ inputs.design }}
      TEST_INPUT: ${{ inputs.test }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-riscv64-unknown-elf gcc-riscv64-unknown-elf
          bash scripts/ci/install_verilator.sh
      - name: Run selected FrameTop test with trace
        run: make -f Makefile.dev frame-test DESIGN="$DESIGN_INPUT" TEST="$TEST_INPUT" TRACE=1
      - name: Upload logs and waveforms
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trace-${{ github.run_id }}
          path: |
            build/logs/
            build/reference-logs/
            build/waves/
          if-no-files-found: warn
          retention-days: 7
